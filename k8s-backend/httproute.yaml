apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tms-backend-route
  namespace: tms-backend-prod
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
  hostnames:
    - "tms-api.superpart.co.th"
  rules:
    # 1. API Backend (Spring Boot)
    - matches:
        - path:
            type: PathPrefix
            value: /api-tms
      backendRefs:
        - name: tms-backend-service
          port: 80

    # 2. Master JSON Files (Nginx)
    - matches:
        - path:
            type: PathPrefix
            value: /ms-tms
      backendRefs:
        - name: tms-master-service
          port: 80
