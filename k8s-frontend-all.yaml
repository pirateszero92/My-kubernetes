# ==========================================
# 🎨 FRONTEND TMS KUBERNETES MANIFESTS
# ==========================================

# 1. Deployment (Frontend Nginx SPA)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tms-frontend-prod
  namespace: default
  labels:
    app: tms-frontend-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tms-frontend-prod
  template:
    metadata:
      labels:
        app: tms-frontend-prod
    spec:
      imagePullSecrets:
        - name: nexus-regcred
      containers:
        - name: tms-frontend
          image: nexus.superpart.co.th/spp/frontend/tms-prod:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
# 2. Service (ClusterIP Port 80)
apiVersion: v1
kind: Service
metadata:
  name: tms-frontend-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: tms-frontend-prod
  ports:
    - port: 80
      targetPort: 80
      name: http
---
# 3. HorizontalPodAutoscaler (Min 2 - Max 10 Replicas)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tms-frontend-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tms-frontend-prod
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# 4. HTTPRoute (NGINX Gateway Fabric)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tms-frontend-route
  namespace: default
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
  hostnames:
    - "tms.superpart.co.th"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: tms-frontend-service
          port: 80
